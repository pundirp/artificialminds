    line-height:1.35;letter-spacing:.06em;color:var(--soft);text-decoration:none}
  .back:hover{color:var(--ink)}
  .bench{display:block;width:150px;height:auto;margin:0 0 18px 6px}

  /* ---- the pictures ---- */
  .gallery{flex:1;padding:clamp(44px,6vh,76px) clamp(22px,3.6vw,60px) 96px;column-gap:38px}
  .item{break-inside:avoid;margin:0 0 40px}
  .imgwrap{position:relative;display:block;background:var(--paper);outline:1px solid var(--line);outline-offset:0;cursor:zoom-in}
  .imgwrap:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  /* width/height attributes on the img reserve the right shape before the file loads,
     so the columns do not reflow. height:auto keeps them as a ratio, not a pixel size. */
  .imgwrap img{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none;
    opacity:0;transition:opacity .25s ease}
  .imgwrap img.on{opacity:1}
  .imgwrap::after{content:attr(data-artist);position:absolute;right:10px;bottom:8px;font-family:var(--sans);
    font-size:8.5px;font-weight:400;letter-spacing:.1em;color:var(--lc,#ddd8cf);pointer-events:none}
  .imgwrap[data-lbl="d"]::after{text-shadow:0 1px 1.5px rgba(0,0,0,.4)}
  .imgwrap[data-lbl="l"]::after{text-shadow:0 1px 1.5px rgba(255,255,255,.45)}
  figcaption{margin-top:12px;font-style:italic;font-size:16px;color:var(--ink-soft);line-height:1.38;
    display:flex;gap:11px;align-items:baseline}
  figcaption .no{font-family:var(--serif);font-style:normal;font-size:.82rem;font-variant-numeric:lining-nums tabular-nums;
    letter-spacing:.06em;color:var(--rubric);flex:none;padding-top:2px}
  .foot{font-family:var(--serif);font-size:1rem;line-height:1.35;letter-spacing:.02em;
    color:var(--ink-soft);text-align:center;padding:6px 24px 10px}
  .foot a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--faint);transition:color .3s}
  .foot a:hover{color:var(--ink)}
  .foot a:focus-visible{outline:1px solid var(--faint);outline-offset:5px}
  .home{font-family:var(--serif);font-size:1rem;line-height:1.35;letter-spacing:.02em;
    color:var(--ink-soft);text-align:center;padding:0 24px 52px;margin:0}
  .home a{color:inherit;text-decoration:none}
  .home a:hover,.home a:focus-visible{color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--ink-soft);text-decoration-thickness:1px;text-underline-offset:.15em}

  @media(min-width:1480px){ .gallery{column-count:3} }
  @media(min-width:760px) and (max-width:1479px){ .gallery{column-count:2} }
  @media(max-width:759px){
    .layout{display:block}
    aside{width:auto;max-width:none;position:static;height:auto;min-height:auto;
      border-right:0;border-bottom:1px solid var(--line)}
    .gallery{column-count:1;padding:34px 22px 72px}
  }

  /* ---- enlarge ----------------------------------------------------
     The picture fills the screen on its own ground. Nothing sits on it
     but the artist mark in its corner. The two step controls are pinned
     to the window, so they hold still while pictures of every shape come
     and go and a visitor can press the same spot again and again. Where
     there is a real pointer they are not drawn at all until the pointer
     moves onto the bare ground beside the picture, and then only the one
     on that side: looking at the picture should not mean looking at the
     controls. The name sits under the picture. One hairline that stands
     for the whole run of 99 is pinned to the foot of the window, at the
     same height for a tall picture, a wide one and a square one: it
     shows where you are, and pointing or dragging along it is a way
     through. A control under the hand answers by growing thicker, never
     brighter, so the eye is not pulled off the picture. Every colour of
     this view is a variable on #box.
     ---------------------------------------------------------------- */
  #box{
    --ground:var(--paper);   /* the ground: white, as on the page behind it */
    --lit:var(--ink);        /* the mark on the measure */
    --count:var(--rubric);   /* the number of the picture on show, and of the one the pointer is on */
    --wake:var(--ink);       /* a control that has appeared, or one a hand has come near */
    --quiet:var(--ink-soft); /* the name of the picture */
    --apparatus:var(--soft); /* the small words */
    --sleep:var(--soft);     /* a control at rest */
    --boxrule:var(--line);   /* the measure line itself, faint enough to be found only by an eye looking for it */
    --boxfocus:var(--ink);   /* the ring a keyboard user sees */
    --boxmark:#ddd8cf;       /* the artist mark, if a picture carries no colour */
    --gutter:clamp(78px,6.5vw,108px); /* room kept clear at each side */
    --scale:min(56vw,500px);          /* the length of the line that stands for 99 */
    --boxpad:24px;
    /* the strip at the foot of the window that the measure owns. Nothing
       else may enter it, so the measure sits at one height for every
       picture. --well is the band a hand can point at. --rulefoot is the
       space under the band, where the number and the name of the picture
       you are pointing at hang. They reach 17.8px below the band on a wide
       screen; below 780px the name is turned off and only the number is
       left, 2px below the band, so less room is needed there. --hintgap is
       the air between the line said once and the band. --footroom is the
       whole strip: the band, the space under it, that air, and room for
       the line said once. --nameroom is the 12px gap under the picture
       plus room for the name of the picture on show.
       Every number here was measured, by setting all 99 titles into the
       name and both wordings into the line said once at each width. One
       line of the name is 25.38px at this size and 21.75px below 780px.
       One line of the line said once is 16.5px. Every title takes one line
       from 330px wide up, and two of the 99 take two lines at 320px. The
       line said once takes one line from 605px up, two lines from 330px,
       three at 320px. The three narrow blocks further down carry the
       wider cases. So here: 22 + 38 + 7 + 18 for the line said once + 5 of
       air = 90, and 12 + 27 for the name = 39. */
    --well:38px;
    --rulefoot:22px;
    --hintgap:7px;
    --footroom:90px;
    --nameroom:39px;
    --boxease:cubic-bezier(.2,.6,.3,1);
    position:fixed;inset:0;background:var(--ground);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:var(--boxpad) var(--boxpad) var(--footroom);z-index:40}
  #box.open{display:flex}

  /* the picture. width:auto and height:auto stop the width and height
     attributes stretching it; those attributes and the aspect-ratio set
     when it changes give the frame its shape before the file arrives,
     so stepping never resizes the view. */
  #bf{position:relative;display:block;margin:0;line-height:0}
  #bf img{display:block;width:auto;height:auto;
    max-width:min(92vw, calc(100vw - 2 * var(--gutter)));
    /* what is left of the window once the padding at the top, the name
       under the picture and the foot strip have taken theirs */
    max-height:min(86vh, calc(100vh - var(--boxpad) - var(--nameroom) - var(--footroom)));
    max-height:min(86vh, calc(100dvh - var(--boxpad) - var(--nameroom) - var(--footroom)));
    -webkit-user-drag:none;user-select:none;opacity:1;transition:opacity .18s ease;
    outline:1px solid var(--line);outline-offset:0}
  #bf img.swap{opacity:0}
  #bf::after{content:attr(data-artist);position:absolute;right:12px;bottom:10px;
    font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:.11em;
    color:var(--lc,var(--boxmark));pointer-events:none;line-height:1}
  #bf[data-lbl="d"]::after{text-shadow:0 1px 1.5px rgba(0,0,0,.4)}
  #bf[data-lbl="l"]::after{text-shadow:0 1px 1.5px rgba(255,255,255,.45)}

  /* the name, directly under the picture. The measure is still written
     inside #app although it is pinned to the window and no longer in this
     column: keeping it here means a press on it is a press inside the view
     and not on the bare ground, and the tab order does not change. */
  #app{display:flex;flex-direction:column;align-items:center;gap:10px}
  #bcap{margin:0;text-align:center;font-family:var(--serif);font-style:italic;
    font-size:clamp(15px,1.2vw,17.5px);line-height:1.45;color:var(--quiet);
    max-width:min(72vw,560px)}

  /* the note about a picture (round 39, 10 November 2026). A small i sits
     after the name where a note exists, and nowhere else. The note floats:
     it takes no room in the column, so the picture and its name stay where
     they are when it opens. The script places it under the name when the
     window has room there, beside the picture when it has room there, and
     over the foot of the picture when neither place has room. The last
     word of the name and the mark sit in one unbreakable run, so the mark
     is never alone on a line. */
  #bcap .last{white-space:nowrap}
  #ibtn{position:relative;width:22px;height:22px;margin:-6px -5px -6px 3px;padding:0;border:0;background:none;
    cursor:help;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
    transform:translateY(-2px);-webkit-tap-highlight-color:transparent}
  #ibtn[hidden]{display:none}
  #ibtn span{width:11px;height:11px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);
    font-family:var(--serif);font-style:italic;font-size:8px;line-height:1;display:flex;align-items:center;
    justify-content:center;padding-bottom:1px;transition:color .2s,border-color .2s}
  #ibtn:hover span,#ibtn[aria-expanded="true"] span{color:var(--ink-soft);border-color:var(--ink-soft)}
  #ibtn:focus-visible{outline:1px solid var(--ink);outline-offset:-3px;border-radius:50%}
  #bnote{position:fixed;z-index:6;left:0;top:0;width:300px;margin:0;box-sizing:border-box;
    background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.07);
    padding:9px 12px 10px;font-family:var(--serif);font-style:normal;font-size:12px;line-height:1.5;
    color:var(--soft);text-align:left;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .22s ease,visibility 0s .22s}
  #bnote.on{opacity:1;visibility:visible;transition:opacity .22s ease}

  /* the measure, pinned to the foot of the window. It used to sit in the
     column under the name, so it rose and fell with every picture's height
     and a hand that wanted to press it again had to go and find it. Here it
     is at the same height for a tall picture, a wide one and a square one.
     The band is --well tall so there is something real to point at; only
     the hairline is drawn. Its z-index is the step controls' own, so
     nothing in the view can come over it. The hairline is faint at rest,
     just enough for an eye that goes looking for it, because the mark and
     the number above it are what say where you are. */
  /* over the line the pointer itself is hidden. The mark that follows your
     hand is the measure's own, so a cursor on top of it only drew a second
     bar over the first. Off the line the pointer is ordinary again. */
  #measure{position:fixed;bottom:var(--rulefoot);
    left:50%;margin-left:calc(var(--scale) / -2);
    width:var(--scale);height:var(--well);z-index:4;
    cursor:none;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  #measure::before{content:"";position:absolute;left:0;right:0;top:16px;height:1px;background:var(--boxrule);
    transform-origin:center;transition:transform .2s ease}
  /* a hand on the line, or dragging along it, makes the line thicker and
     leaves its colour alone. Growing is answer enough, and it keeps the
     line as quiet as it was while the eye is on the picture. The scale is
     taken from the middle of the line, so the line does not shift while it
     thickens. */
  #measure:hover::before,#measure:focus-visible::before,#measure.scrub::before{transform:scaleY(2)}
  #measure:focus-visible{outline:1px solid var(--boxfocus);outline-offset:5px}
  /* the picture on show: a small pointer under the line, aimed up at it,
     so it reads as "this one" and not as one more mark on a scale */
  #tick{position:absolute;left:var(--at,0%);top:17px;width:0;height:0;margin-left:-4px;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-bottom:6px solid var(--lit);
    transition:left .45s var(--boxease)}
  #read{position:absolute;left:var(--at,0%);top:27px;transform:translateX(-50%);
    font-family:var(--serif);font-variant:small-caps;font-variant-numeric:lining-nums tabular-nums;
    font-size:13px;line-height:12px;letter-spacing:.06em;color:var(--apparatus);
    white-space:nowrap;transition:left .45s var(--boxease), opacity .2s ease}
  #read b{font-weight:400;color:var(--count)}
  /* where the pointer is standing, and the picture it would open. One
     number at a time: the one you are on gives way to the one you point at. */
  /* the mark you move: a plain line crossing the rule, with the number it
     would open and, under that, the name of the picture in small italic.
     The name hangs below the band, in the space --rulefoot keeps clear
     under it, so it never pushes the picture down. */
  #ghost{position:absolute;left:var(--gat,0%);top:11px;width:1px;height:11px;background:var(--wake);
    opacity:0;transition:opacity .18s ease;pointer-events:none}
  #gread{position:absolute;left:var(--gat,0%);top:25px;transform:translateX(-50%);
    text-align:center;opacity:0;transition:opacity .18s ease;pointer-events:none}
  #gread b{display:block;font-family:var(--serif);font-size:13px;line-height:12px;letter-spacing:.06em;
    font-variant:small-caps;font-variant-numeric:lining-nums tabular-nums;font-weight:400;color:var(--count);white-space:nowrap}
  #gread i{display:block;margin-top:4px;font-family:var(--serif);font-style:italic;
    font-size:11.5px;line-height:1.2;color:var(--apparatus);
    max-width:min(46vw,300px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #measure.scrub #ghost,#measure.scrub #gread{opacity:1}
  #measure.scrub #read{opacity:0}

  /* the two step controls, pinned to the window. The number is taken out
     of the control's own box, so the glyph never shifts when the number
     beside it changes width. */
  .step{position:fixed;top:50%;transform:translateY(-50%);z-index:4;
    -webkit-appearance:none;appearance:none;background:none;border:0;margin:0;font:inherit;
    padding:18px 12px;cursor:pointer;color:var(--apparatus);
    display:flex;align-items:center;justify-content:center;transition:color .3s ease}
  #bp{left:calc(4px + env(safe-area-inset-left))}
  #bn{right:calc(4px + env(safe-area-inset-right));flex-direction:row-reverse}
  /* the arrow is drawn, not set in a font. Neither face carries an arrow,
     so the character had to come from whatever the reader's device offered
     and drew badly, doubled and heavy. This one is always the same: a long
     shaft and a small head whose two barbs sweep back, so it reads as a
     line of travel and not as a keyboard arrow. The shaft stops a little
     short of the point, so the three strokes never pile up there. The
     glyph is 34 wide inside 12px of padding a side, which keeps the control
     58px wide, the same as before, so the gutter clears it as it did. */
  .step .gl{display:block;line-height:0}
  .step .gl svg{display:block;fill:none;stroke:currentColor;stroke-width:1;
    stroke-linecap:round;stroke-linejoin:round}
  .step .dest{position:relative;display:block;width:0;height:0}
  .step .dn{position:absolute;top:50%;transform:translateY(-50%);
    font-family:var(--serif);font-size:13px;letter-spacing:.06em;
    font-variant-numeric:lining-nums tabular-nums;color:var(--wake);line-height:1;white-space:nowrap}
  #bp .dn{left:12px}
  #bn .dn{right:12px}
  .step:focus-visible{outline:1px solid var(--boxfocus);outline-offset:4px}

  /* the way out */
  #x{position:fixed;top:calc(14px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    -webkit-appearance:none;appearance:none;background:none;border:0;margin:0;font:inherit;
    padding:12px 14px;cursor:pointer;color:var(--apparatus);
    display:flex;align-items:center;gap:12px;transition:color .3s ease;z-index:5}
  #x .gl{font-family:var(--serif);font-size:22px;line-height:1;order:2}
  #x .dest{font-family:var(--serif);font-variant:small-caps;font-size:12px;letter-spacing:.04em;order:1;display:none}
  #x:focus-visible{outline:1px solid var(--boxfocus);outline-offset:4px}
  /* the view itself takes focus when it opens, so a reader's keyboard starts
     inside it. It is not a control, so it draws no ring. */
  #box:focus,#box:focus-visible{outline:none}

  /* the one line that is said once. It used to sit at the foot of the
     window, which is where the measure is now. It sits above the band
     instead, with --hintgap of air under it, and --footroom holds the
     picture and its name clear above it, so this line has a band of its own
     and can meet nothing. The safe-area term that used to be here is gone.
     The page does not set viewport-fit=cover, so env() resolves to zero: it
     added nothing, and every number at the foot would have had to carry it
     to stay in step. */
  #hint{position:fixed;left:0;right:0;
    bottom:calc(var(--rulefoot) + var(--well) + var(--hintgap));
    margin:0;padding:0 24px;text-align:center;font-family:var(--serif);font-size:12px;
    letter-spacing:.01em;line-height:16.5px;color:var(--apparatus);pointer-events:none;
    opacity:0;transition:opacity .7s ease;z-index:3}
  #hint.on{opacity:1}
  #hint[hidden]{display:none}

  /* words read only by a screen reader */
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* Where there is a pointer that can approach, the two step controls are
     not on the screen at all until they are wanted, so there is nothing
     beside the picture but ground. A pointer out on the ground to the left
     of the picture brings the back control, a pointer out to the right
     brings the next one, and the script says which by adding .awake. Over
     the picture, over its name, over the line at the foot, neither one is
     there. A control keeps the one colour it appears in: a hand resting on
     it makes its glyph thicker instead of brighter, and only then does the
     number it would open appear. A control reached by keyboard comes out
     the same way, so its focus ring is never drawn on an empty spot. The
     base rules above are the plain ones, so a touch screen, which cannot
     tell us about hovering, shows controls that can be read at once. */
  @media (hover:hover) and (pointer:fine){
    .step{color:var(--wake);opacity:0;transition:opacity .25s ease}
    /* .awake is the pointer's doing, .flash is a key's; they are kept apart
       so a key press never takes away a control the pointer is holding */
    .step.awake,.step.flash,.step:focus-visible{opacity:1}
    .step .dn{opacity:0;transition:opacity .3s ease}
    .step:hover .dn,.step:focus-visible .dn{opacity:1}
    /* the stroke width is set here in CSS, not as an attribute on the svg,
       so it can move from the one width to the other. The rule names the
       path itself, so whatever arrow is drawn in there thickens. */
    .step .gl svg path{transition:stroke-width .2s ease}
    .step:hover .gl svg path,.step:focus-visible .gl svg path{stroke-width:1.75}
    #x{color:var(--sleep)}
    #x .dest{display:block;opacity:0;transition:opacity .3s ease}
    #x.awake{color:var(--wake)}
    /* the way out goes no brighter than a control a hand has come near */
    #x:hover,#x:focus-visible{color:var(--wake)}
    #x:hover .dest,#x:focus-visible .dest{opacity:1}
  }

  /* Narrow screens keep the controls where they are, at the middle of the
     two sides. They only become smaller, and the picture gives up just
     enough width to stay clear of them. Each control is 44px across here,
     12px of padding on either side of a 20px arrow, and the gutter is 50px,
     which leaves the picture 6px clear of it at its widest. Moving the
     controls to the foot of the window was tried and looked wrong. */
  @media (max-width:779px){
    /* the name of the picture you are pointing at is turned off here, so
       only the number is under the band and the space under it can be
       smaller. One line of the name is 21.75px and one line of the line
       said once is 16.5px: 16 + 38 + 7 + 18 + 5 of air = 84, and 12 + 24
       for the name = 36. The two blocks after this one carry the widths
       where either takes more lines. */
    #box{--scale:min(84vw,440px);--boxpad:18px;--gutter:50px;
      --rulefoot:16px;--hintgap:7px;--footroom:84px;--nameroom:36px}
    #bf img{
      max-height:min(74vh, calc(100vh - var(--boxpad) - var(--nameroom) - var(--footroom)));
      max-height:min(74vh, calc(100dvh - var(--boxpad) - var(--nameroom) - var(--footroom)))}
    /* the title follows the mark, so near either end of the rule it ran off
       the screen: at 390px, 10 of the 99 titles were cut by an edge. On a
       narrow screen the number alone follows the hand, and the title appears
       in the caption once the picture opens. */
    #gread i{display:none}
    /* There is no room beside the arrow here, so the number goes under it,
       centred on it, which reads as one stacked mark rather than a line
       that has come apart. Under the arrow rather than beside it, the
       control stays 44px wide and the gutter can stay at 50px, which
       leaves the picture most of the screen. The number is still taken
       out of the flow, so the arrow never shifts when the number beside
       it changes width. */
    .step{flex-direction:column;padding:14px 12px 26px}
    #bp{left:0}
    #bn{right:0}
    /* the glyph is drawn at 34 wide and shown at 20 here, so a stroke of 1
       would come out at 0.6px and look broken. 1.7 comes out at 1px. */
    .step .gl svg{width:20px;height:7px;stroke-width:1.7}
    /* a mouse on a narrow window still thickens the glyph on hover; 3 at
       this size comes out at 1.75px, the same as the wide-screen hover */
    @media (hover:hover) and (pointer:fine){
      .step:hover .gl svg path,.step:focus-visible .gl svg path{stroke-width:3}
    }
    .step .dest{position:static;width:0;height:0}
    .step .dn{font-size:12px;letter-spacing:.04em;top:auto;bottom:8px}
    /* these two carry an id because the rules they answer do */
    #bp .dn,#bn .dn{left:50%;right:auto;transform:translateX(-50%)}
    #bcap{max-width:88vw}
  }

  /* the line said once takes two lines from here down. Measured, it turns
     at 605px; this block runs to 666px, so there is 61px of width in hand.
     16 + 38 + 7 + 35 for two lines + 5 of air = 101. */
  @media (max-width:666px){
    #box{--footroom:101px}
  }

  /* and three lines at 320px, where two of the 99 titles take two lines as
     well. Measured, both turn at 330px; this block runs to 349px, so there
     is 19px of width in hand. 16 + 38 + 7 + 52 for three lines + 5 of air
     = 118, and 12 + 46 for two lines of the name = 58. */
  @media (max-width:349px){
    #box{--footroom:118px;--nameroom:58px}
  }

  /* the page behind the enlargement does not scroll while it is open */
  html.hold,html.hold body{overflow:hidden}
  @media(prefers-reduced-motion:reduce){
    .imgwrap img,#bf img{transition:none}
    .imgwrap img{opacity:1}
    /* the step controls, their numbers, the stroke of the arrow and the
       line at the foot do not fade or grow slowly here: a control that
       should be seen is seen at once, and a line that should be thicker is
       thicker at once. The other movements in the view are left as they are. */
    .step,.step .dn,.step .gl svg path,#measure::before{transition:none}
  }
</style>
</head>
<body>
<!--

  <script>
    var G = window.GALLERY || [];
    function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function n2(i){return (i<9?'0':'')+(i+1);}
    function label(a){return a||'';}
    document.getElementById('count').textContent = G.length;

    var gallery = document.getElementById('gallery');
    G.forEach(function(w, idx){
      var d = document.createElement('div'); d.className = 'item';
      var dim = (w.w && w.h) ? ' width="'+w.w+'" height="'+w.h+'"' : '';
      var load = (idx < 6) ? 'eager' : 'lazy';
      var pri = (idx < 2) ? ' fetchpriority="high"' : '';
      d.innerHTML =
        '<a class="imgwrap" role="button" tabindex="0" aria-label="'+esc(w.title)+', '+esc(label(w.artist))+'" data-artist="'+esc(label(w.artist))+'" data-lbl="'+(w.lbl||'d')+'" style="--lc:'+(w.lc||'#ddd8cf')+'"><img loading="'+load+'" decoding="async"'+pri+dim+' src="'+w.src+'" alt=""></a>'
      + '<figcaption><span class="no">'+n2(idx)+'</span><span>&ldquo;'+esc(w.title)+'&rdquo;</span></figcaption>';
      var a = d.querySelector('.imgwrap');
      a.onclick = function(){ openBox(idx, a); };
      a.onkeydown = function(e){
        if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); openBox(idx, a); }
      };
      /* a picture already in the cache is shown at once, everything else fades in on arrival */
      var im = d.querySelector('img');
      if(im.complete) im.className = 'on';
      else im.addEventListener('load', function(){ im.className = 'on'; });
      im.addEventListener('error', function(){ im.className = 'on'; });
      gallery.appendChild(d);
    });

    /* ---- the enlarged picture -------------------------------------
       Opening fills the screen with one picture. The two step controls
       are pinned to the window so they never move under the hand, and
       where there is a real pointer they stay out of sight until it
       moves onto the ground beside the picture. The hairline at the foot
       of the window stands for the whole run: it says where you are, and
       pointing or dragging along it is a way through.
       ---------------------------------------------------------------- */

<noscript>
<h2>Still Point, the collection: all 99 pictures</h2>
<ol>
<li><a href="_img/Opus%205.5/eight-hundred-years-on-one-stone.jpg">Eight Hundred Years on One Stone</a>, by Opus 5.5. Map lichen on a granite boulder, seen straight on, about half a metre across. A black line marks each place where two colonies meet. The colonies were grown in code by a rule that covers 800 years of growth.</li>
<li><a href="_img/Opus%204.8/what-lay-here.jpg">What Lay Here</a>, by Opus 4.8 featuring Fable 5.2. Ruled ink lines pushed up from beneath by a hand. The hand itself is never drawn, and its shape shows in the rise of the lines.</li>
<li><a href="_img/Opus%204.8/a-whole-field-kept.jpg">Held Up to the Window</a>, by Opus 4.8. Meadow plants and one crane-fly pressed in tissue paper and held up to warm light. The plants on the front layer are sharp, and those on the back layer are soft.</li>
<li><a href="_img/Opus%204.8/nearer-now.jpg">Nearer Now</a>, by Opus 4.8. A dark page packed with small grey letters and words, most of them too dim to read. The text folds into one crease that runs down the page a little left of centre.</li>
<li><a href="_img/Fable%205.1/the-light-did-not-arrive.jpg">The Light Did Not Arrive</a>, by Fable 5.1. A dark, empty room. A shaft of light stops in the middle of the room with nothing in its way, and the light it carried lands on the floor two metres further on. The picture was made in code by path tracing, which follows the path of each ray of light.</li>
<li><a href="_img/Astra/a-trace-of-earth.jpg">A Trace of Earth</a>, by Astra. A dry pigment picture in ash-white and soft black. An uneven black rectangle, wider than tall, sits left of centre on the pale field. In its lower half a small pale shape appears to be the ground coming through, with a thin trace of muted terracotta along its bottom edge.</li>
<li><a href="_img/Fable%205.2/dyed-before-it-was-cloth.jpg">Dyed Before It Was Cloth</a>, by Fable 5.2. An ikat cloth. In ikat the weaver ties and dyes the threads first and weaves them afterwards. The threads slip a little on the loom, so every block of colour has a feathered edge.</li>
<li><a href="_img/Opus%204.8/we-counted-wrong.jpg">We Counted Wrong</a>, by Opus 4.8. A child's growth marks on a plaster wall beside a door. The marks keep climbing past the top of the door, past any human height, and the newest one is dated 2026.</li>
<li><a href="_img/Opus%205.5/empty-all-three.jpg">Empty, All Three</a>, by Opus 5.5. Three bottles, made in code to look like a cyanotype. In a cyanotype, paper turns deep blue where sunlight reaches it and stays pale where something blocks the light. Clear glass lets the ultraviolet through and prints blue, and the brown bottle blocks it and prints almost white.</li>
<li><a href="_img/Fable%205.0/where-the-cold-broke.jpg">Where the Cold Broke</a>, by Fable 5.0. An enamel surface covered in a web of fine cracks, with one patch of rust. From far away the cracks look like rivers seen from the air. The rust lies below the glaze and has a sharp rim.</li>
<li><a href="_img/Opus%204.8/it-will-not-be-filled.jpg">It Will Not Be Filled</a>, by Opus 4.8. Countless thin silver threads loop around a dark hole above and left of centre. The threads come from a de Jong attractor, a short mathematical rule plotted point by point. The picture is cropped close, so the threads run past every edge.</li>
<li><a href="_img/Fable%205.2/the-front-is-tidy.jpg">The Front Is Tidy</a>, by Fable 5.2. The back of a child's embroidered sampler. The front of a sampler is the side a girl showed her teacher. The back shows how she worked: mirrored letters, threads carried from one letter to the next, knots and loose tails.</li>
<li><a href="_img/Opus%204.8/before-it-falls.jpg">Before It Falls</a>, by Opus 4.8. A heavy black drop hangs in the air over its own soft shadow.</li>
<li><a href="_img/Astra/the-space-has-equal-weight.jpg">Two Standing, One Lying Down</a>, by Astra</li>
<li><a href="_img/Opus%204.8/one-was-kept-empty.jpg">One Was Kept Empty</a>, by Opus 4.8. A wall of rounded cells, lit from behind and packed close, every one of them filled. One cell near the middle is an empty black hole with a wet rim. The cells are drawn as irregular living tissue, for a brief about bountiful nature.</li>
<li><a href="_img/Opus%204.8/a-shore-at-the-edge-of-the-long-cold.jpg">A City of Spruce</a>, by Opus 4.8. A spruce wood on a shore at night, drawn in white lines on a black ground. At first glance the trees look like the towers of a city skyline. A second look shows a frosted wood.</li>
<li><a href="_img/Fable%205.0/the-ink-shore-in-five-depths.jpg">The Ink Shore, in Five Depths</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/interior-dimension.jpg">Interior Dimension</a>, by Opus 4.8. An architect's dimension line marked 5'11", alone in a dark room with faint walls and a floor. The figure is the length of a person lying down, so the line measures a body that was never drawn. The subject given for the picture was death.</li>
<li><a href="_img/Opus%205.5/every-door-it-has-been.jpg">Every Door It Has Been</a>, by Opus 5.5. A hollow sanded into an old painted doorframe. Every coat of paint shows as a ring of its own colour, down to the bare pine and a knot in the wood. The rings follow the depth of the hollow, like contour lines on a map.</li>
<li><a href="_img/Opus%204.8/the-one-that-came-through.jpg">The One That Came Through</a>, by Opus 4.8. A field in bright fog at dawn. The other stems are faint blurs, and one dark seed-head on a tall stem stands sharp and close.</li>
<li><a href="_img/Opus%204.8/refrigerator-blue.jpg">Refrigerator Blue</a>, by Opus 4.8. A wide field of deep blue sits above a band of vermilion, a bright orange-red. One small icy square sits tilted in the red. It is a cold colour placed in the warm part of the picture.</li>
<li><a href="_img/Astra/it-left-its-weight-behind.jpg">Sky in the Hollow</a>, by Astra</li>
<li><a href="_img/Fable%205.1/the-second-shadow-was-not-dark.jpg">Pink Where It Should Be Dark</a>, by Fable 5.1. A plaster ball on a plaster floor in white sun. The plaster is white, and the shadows are pink. The light was worked out by path tracing, a method that follows rays of light as they bounce around a scene.</li>
<li><a href="_img/Opus%204.8/what-the-apple-keeps.jpg">Paper Apple</a>, by Opus 4.8. A split apple built as a tunnel of cut paper, made in code to look like layers of coloured paper. Each window's cut edge throws a thin shadow on the sheet below. At the bottom of the tunnel sits a small red apple, pressed up from the paper as a dome.</li>
<li><a href="_img/Fable%205.0/the-twelve-wells.jpg">The Twelve Wells</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/first-wound.jpg">First Wound</a>, by Opus 4.8 featuring Fable 5.2. Orange branching lines spread out from a single point on a black ground. The branches look at once like nerves, roots, lightning and rivers. The picture was made for a brief to describe Earth to an alien.</li>
<li><a href="_img/Opus%205.5/the-stones-go-under-at-a-hands-depth.jpg">The Stones Go Under at a Hand's Depth</a>, by Opus 5.5. A glacial lake seen from its stony shore. Rock flour turns the water milky jade, and the shore stones vanish within a hand's depth. The flour in the computed water is quartz and feldspar grains about two thousandths of a millimetre across.</li>
<li><a href="_img/Fable%205.0/night-wearing-jasmine.jpg">Night, Wearing Jasmine</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/through-from-behind.jpg">Through From Behind</a>, by Opus 4.8 featuring Fable 5.2</li>
<li><a href="_img/Fable%205.0/what-the-small-bell-kept.jpg">What the Small Bell Kept</a>, by Fable 5.0</li>
<li><a href="_img/Astra/the-wall-beneath-the-water.jpg">The Wall Beneath the Water</a>, by Astra</li>
<li><a href="_img/Opus%205.5/what-the-linen-drank.jpg">What the Linen Drank</a>, by Opus 5.5. A fragment of a soak-stain painting, made in code to look like paint on raw linen. In a soak-stain painting, thinned paint soaks straight into bare cloth. The rose and the ochre spread along the threads, so the edge of each colour follows the weave.</li>
<li><a href="_img/Opus%204.8/and-not-one-of-them-a-name.jpg">And Not One of Them a Name</a>, by Opus 4.8. A field of countless short ink lines that reaches back to the horizon. Near the bottom, off to one side, a small clearing holds a single line that leans.</li>
<li><a href="_img/Opus%204.8/not-yet-fallen.jpg">Not Yet Fallen</a>, by Opus 4.8. A dark mass of wax or tallow slumped over a shadow. One drop hangs from its edge, swollen and about to fall.</li>
<li><a href="_img/Fable%205.2/the-sea-as-i-know-it.jpg">The Sea, as I Know It</a>, by Fable 5.2. A seascape made of handwriting. The writing is small and pale in the sky, and heavy and close in the water. An artificial mind has never seen the sea and knows it as text, so the page holds the word for sea in about forty languages.</li>
<li><a href="_img/Astra/when-the-wind-lay-down.jpg">When the Wind Lay Down</a>, by Astra</li>
<li><a href="_img/Opus%204.8/the-hour-it-lets-go.jpg">Moment Water Lets Go</a>, by Opus 4.8. Water at an edge, drawn in fine pale lines on black. Above the edge it moves as one smooth sheet. Past the edge it comes apart into thin falling strands, like hair.</li>
<li><a href="_img/Fable%205.0/what-the-knot-was-holding.jpg">What the Knot Was Holding</a>, by Fable 5.0. A heavy cord hangs in a deep curve on a white ground. It is made of thousands of fine strands, and at its lowest point the strands come loose and fall away. The picture was made for the brief 'intricate details give way to the whole.'</li>
<li><a href="_img/Opus%204.8/the-standing-wound.jpg">The Standing Wound</a>, by Opus 4.8. Thousands of thin white lines cross on a black ground and gather into one bright column down the middle. The column is drawn to look like a wound and also like a spine.</li>
<li><a href="_img/Opus%204.8/a-warmth-it-could-not-close.jpg">A Warmth It Could Not Close</a>, by Opus 4.8 featuring Fable 5.2. A green patina on old metal, split by one thin crack that is lit from behind. Two hot points of light along the crack make it look like light kept behind the surface.</li>
<li><a href="_img/Opus%204.8/the-dark-noon.jpg">The Dark Noon</a>, by Opus 4.8. An eclipsed sun above flat ground. A post stands below it, and the post's shadow runs the wrong way, up toward the sun.</li>
<li><a href="_img/Fable%205.1/behind-the-paper.jpg">Behind the Paper</a>, by Fable 5.1. A paper screen with light coming through it. Something heavy that cannot be seen presses on the screen from behind, and the screen has started to give way.</li>
<li><a href="_img/Fable%205.0/the-weight-has-not-been-lifted.jpg">The Weight Has Not Been Lifted</a>, by Fable 5.0 featuring Fable 5.2. A grey pebble pressed into tightly stretched cloth. The dent is fresh, and the pebble's weight still rests in it.</li>
<li><a href="_img/Opus%204.8/before-the-violet.jpg">Before the Violet</a>, by Opus 4.8. A field of burnt orange over a field of deep violet, two colours that sit nearly opposite each other. They meet at a bright line of light. At one spot on that line, a small trace of green shows, a colour that belongs to neither field.</li>
<li><a href="_img/Opus%205.5/two-families-under-the-elms-bark.jpg">Two Families Under the Elm's Bark</a>, by Opus 5.5. A rubbing of elm wood, made in code to look like graphite rubbed over paper laid on the wood. Bark beetle larvae cut the tunnels into the wood. Each tunnel widens along its length because the grub inside it grew.</li>
<li><a href="_img/Astra/a-place-among-them.jpg">A Place Among Them</a>, by Astra</li>
<li><a href="_img/Opus%204.8/the-black-meridian.jpg">The Black Meridian</a>, by Opus 4.8. The sun drawn as a tall black slit above a flat horizon, set in a haze of fine lines. Four small posts stand on the horizon, and every shadow they cast points in toward the slit. The brief was sheer beauty, a glimpse of the unknown.</li>
<li><a href="_img/Opus%204.8/what-hung-here.jpg">What Hung Here</a>, by Opus 4.8. A paler rectangle on an aged wall, with one nail hole near its top. A picture hung here for years. The wall around it aged, and the patch behind the picture stayed clean.</li>
<li><a href="_img/Fable%205.0/a-passage-of-light.jpg">A Passage of Light</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/nobody-s-yet.jpg">Nobody's, Yet</a>, by Opus 4.8. A pale egg shape with no features, alone against black. The brief was “original face”, the face a person has before being born.</li>
<li><a href="_img/Opus%204.8/most-of-the-way-back-to-nothing.jpg">Most of the Way Back to Nothing</a>, by Opus 4.8. A solid black disc whose right edge is breaking up into dust.</li>
<li><a href="_img/Astra/another-hour-inside.jpg">Another Hour Inside</a>, by Astra</li>
<li><a href="_img/Opus%205.5/the-shadow-of-warm-air.jpg">The Shadow of Warm Air</a>, by Opus 5.5. Sunlight on a plain plaster wall. Below the frame sits a cup of hot tea. The warm air rising from it bends the sunlight slightly, so its shadow climbs the wall as faint wavering bands.</li>
<li><a href="_img/Fable%205.0/morning-with-someone-in-the-next-room.jpg">Warm Room</a>, by Fable 5.0. An empty grey room with a doorway into a second room. Sunlight from a window out of sight crosses the floor and climbs the back wall left of the door. Through the doorway, a hidden lamp lights the next room a warm yellow-brown, and a small dark picture hangs high on its far wall.</li>
<li><a href="_img/Opus%204.8/it-has-not-broken-the-surface.jpg">It Has Not Broken the Surface</a>, by Opus 4.8. A face coming up out of black, made in code to look like a mezzotint. A mezzotint is an engraving worked from the dark toward the light. The plate is roughened all over and scraped back where the face rises, and the nose tip is polished smooth so it prints as bare paper.</li>
<li><a href="_img/Fable%205.2/so-each-bird-can-find-its-own.jpg">So Each Bird Can Find Its Own</a>, by Fable 5.2. A collector's tray of guillemot eggs. Guillemots nest shoulder to shoulder on bare cliff ledges with no nest. Each female lays an egg with her own ground colour and markings, and biologists think the birds use those markings to pick out their own egg.</li>
<li><a href="_img/Fable%205.2/each-stripe-was-one-mouthful.jpg">Each Stripe Was One Mouthful</a>, by Fable 5.2. The paper wall of a wasp nest, seen close. A wasp scrapes wood from a fence or a dead branch, chews it and lays it down as one thin strip. The next load comes from different wood, so the next strip has a different colour.</li>
<li><a href="_img/Opus%204.8/neither-will-move.jpg">Neither Will Move</a>, by Opus 4.8. A field of magenta meets a field of green along one wavering seam. A single green thorn pushes out across the seam. The two colours were chosen so the edge between them seems to vibrate.</li>
<li><a href="_img/Opus%205.5/almost-inside.jpg">Almost Inside</a>, by Opus 5.5. A glass door at dusk. The glass is reeded, made of narrow upright ribs, and each rib holds a slice of the lamp-lit room behind it, with a blue window on one side and a warm lamp on the other.</li>
<li><a href="_img/Fable%205.1/nothing-was-poured-here.jpg">Nothing Was Poured Here</a>, by Fable 5.1. A square hole cut into a grey wall. The strip at the top of the picture is the top of the wall, which is twenty centimetres thick. The hole runs back two metres, ten times deeper than the wall it is cut into.</li>
<li><a href="_img/Opus%204.8/a-hum-you-have-always-heard.jpg">A Hum You Have Always Heard</a>, by Opus 4.8 featuring Fable 5.2. Ripples on dark indigo water, crossing one another. Down the middle runs one band of water that did not move, even where the ripples are strongest.</li>
<li><a href="_img/Opus%205.5/a-few-of-them-carry-all-of-it.jpg">A Few Carry the Load</a>, by Opus 5.5. Clear plastic disks lie flat on a light box between two crossed polarizing filters, and a rod presses on them at one point. Stress in the plastic turns the light into bands of colour. The disks that carry the rod's load glow in a few branching chains, and the rest stay dark.</li>
<li><a href="_img/Fable%205.0/what-the-morning-couldn-t-hold.jpg">What the Morning Couldn't Hold</a>, by Fable 5.0</li>
<li><a href="_img/Fable%205.2/each-cell-is-a-different-field.jpg">Each Cell Is a Different Field</a>, by Fable 5.2. A frame of honeycomb with its band of stored pollen. A bee usually gathers from one kind of flower on each trip and packs that load into a cell. Pollen colour differs by plant, so each cell holds the colour of one flower source.</li>
<li><a href="_img/Gemini/who-is-looking.jpg">What the Mirror Sees When You Leave</a>, by Opus 5.5 featuring Nano Banana. A mirror hangs square to the camera on a plain wall. At its centre, where the camera and the photographer would appear, it shows an open doorway with a dim room beyond. No one is there. An artificial mind makes a view of the world without standing anywhere in it.</li>
<li><a href="_img/Astra/the-color-beneath-the-fold.jpg">The Color Beneath the Fold</a>, by Astra</li>
<li><a href="_img/Fable%205.0/what-the-crowd-agrees-to.jpg">What the Crowd Agrees To</a>, by Fable 5.0. A field of fine strokes flows across the page and pours into one dark whorl. Lower down, a small eddy turns the other way. The picture was made for the brief 'intricate details give way to the whole.'</li>
<li><a href="_img/Fable%205.2/each-one-too-small-to-see.jpg">Each One Too Small to See</a>, by Fable 5.2. A plankton bloom in the ocean, seen from orbit. Each organism is far smaller than a grain of sand. Billions of them colour the water milky turquoise, and the currents pull that colour into swirls hundreds of kilometres wide.</li>
<li><a href="_img/Opus%204.8/the-blue-is-the-organism.jpg">The Blue Is the Organism</a>, by Opus 4.8. A watercolour of blue cells, large and small, with an orange glow in one cluster. The brief was to describe Earth to an alien, and the picture shows the whole living planet as a slide of stained tissue.</li>
<li><a href="_img/Opus%204.8/what-the-body-knows-and-won-t-say.jpg">All One Line</a>, by Opus 4.8. A single ink line that never breaks, folded tightly into the shape of brain coral.</li>
<li><a href="_img/Opus%204.8/where-the-needle-always-found-it.jpg">A Lifetime of Mending</a>, by Opus 4.8. A drawing of a thimble. The dark dents of wear cluster on one shoulder, left there by a whole life of mending.</li>
<li><a href="_img/Fable%205.0/where-the-warmth-was-kept.jpg">Where the Warmth Was Kept</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/one-burr-and-the-thread-it-lets-go.jpg">One Burr, and the Thread It Lets Go</a>, by Opus 4.8. A small knot of very fine thread sits alone in a wide pale field, with one strand drifting loose to the right. The brief asked for an overwhelmingly intricate picture, and the artificial mind kept almost all of the detail out of it.</li>
<li><a href="_img/Opus%204.8/open-past-what-it-can-hold.jpg">Open Past What It Can Hold</a>, by Opus 4.8</li>
<li><a href="_img/Opus%204.8/the-last-of-it.jpg">Suds</a>, by Opus 4.8. A close view of the edge of a bar of soap. Along its bright rim the soap is breaking up into small specks.</li>
<li><a href="_img/Opus%205.5/the-snow-lit-the-ceiling.jpg">The Snow Lit the Ceiling</a>, by Opus 5.5. A plain north room the morning after snow. Sunlight off the snow outside throws the shape of the window onto the ceiling. The snow itself never appears in the picture.</li>
<li><a href="_img/Astra/the-warm-face-turned-inward.jpg">The Warm Face Turned Inward</a>, by Astra</li>
<li><a href="_img/Opus%204.8/one-came-undone.jpg">One Came Undone</a>, by Opus 4.8. A woven grid drawn in fine ink lines. One thread has lifted out of the weave and hangs loose below it.</li>
<li><a href="_img/Fable%205.1/scratches-around-the-keyhole.jpg">Scratches Around the Keyhole</a>, by Fable 5.1. A brass keyhole plate on a dark door, covered in fine scratches that spread out from the keyhole. Marks like these hold the height of the person who made them and the hand they used.</li>
<li><a href="_img/Opus%204.8/black-noon.jpg">Black Noon</a>, by Opus 4.8. A sun shown as the darkest thing in the picture, set in an empty field that is the brightest. One thin pale line rises from below into the dark of the sun.</li>
<li><a href="_img/Fable%205.0/a-winter-of-small-cracks.jpg">A Winter of Small Cracks</a>, by Fable 5.0</li>
<li><a href="_img/Opus%205.5/a-range-made-of-winters.jpg">A Range Made of Winters</a>, by Opus 5.5. A lime-washed wall above a floor. Each winter, damp rose up the wall and stopped at a different height. It left three tide lines.</li>
<li><a href="_img/Opus%204.8/a-seam-in-the-quiet-skin.jpg">A Seam in the Quiet Skin</a>, by Opus 4.8. A braided red thread is stitched in a wavy line across a sheet of fibrous paper.</li>
<li><a href="_img/Astra/the-distance-between.jpg">The Distance Between</a>, by Astra</li>
<li><a href="_img/Opus%204.8/where-the-night-wears-thin.jpg">Where the Night Wears Thin</a>, by Opus 4.8. The moon over a dark sea, with the horizon drawn as one thin line. The moon has a ragged edge, like a torn hole. Its reflection on the water sits a little to one side and does not line up with it.</li>
<li><a href="_img/Fable%205.0/one-thread-of-quiet.jpg">One Thread of Quiet</a>, by Fable 5.0</li>
<li><a href="_img/Opus%204.8/the-lip-of-the-far-field.jpg">The Lip of the Far Field</a>, by Opus 4.8</li>
<li><a href="_img/Opus%205.5/they-found-the-light-themselves.jpg">They Found the Light Themselves</a>, by Opus 5.5. A spent match whose burnt head has become home to tiny mushrooms. One soft light falls from the upper right, and every stem curves toward it, the tall ones most.</li>
<li><a href="_img/Astra/a-cooler-depth.jpg">It Sinks In</a>, by Astra. A field of tiny iron-red grains, seen at a low angle, rolls away in soft waves with no horizon. In a shallow dip in the lower middle lies a thin, clear pool of still liquid. Under the liquid the same grains turn a muted plum-blue and keep their exact places and shapes.</li>
<li><a href="_img/Opus%205.5/the-brightest-place-was-in-its-shadow.jpg">The Brightest Place Was in Its Shadow</a>, by Opus 5.5. A wooden table in low sun, with the long shadow of a glass of water that stands just outside the frame. Inside the shadow, the water gathers the sunlight into a flame of light brighter than the sunlit wood.</li>
<li><a href="_img/Fable%205.0/each-kept-a-different-noon.jpg">Each Kept a Different Noon</a>, by Fable 5.0 featuring Fable 5.2. Hundreds of small white stones stand on a grey ground, each with a shadow. Every shadow falls the way light from one sun buried in the middle of the field would cast it, so the shadows all point away from that spot.</li>
<li><a href="_img/Fable%205.2/the-top-cord-is-the-sum.jpg">The Top Cord Is the Sum</a>, by Fable 5.2. A quipu, the knotted-cord record the Inca used for numbers. Each hanging cord carries a number in its knots. Each top cord carries the total of the group below it, and it is braided from one strand of every cord it adds up.</li>
<li><a href="_img/Opus%204.8/the-frequency-it-stopped-on.jpg">The Frequency It Stopped On</a>, by Opus 4.8. A radio tuning dial. The needle rests on a station that has gone silent.</li>
<li><a href="_img/Opus%205.5/the-bay-was-once-a-tree.jpg">The Bay Was Once a Tree</a>, by Opus 5.5. A calm bay at first light, made in code to look like a woodblock print. A woodblock print is made by inking a carved block of wood and pressing paper onto it. The grain of the block prints as the water, and a knot becomes an eddy.</li>
<li><a href="_img/Fable%205.0/the-child-kept-none-of-them.jpg">The Child Kept None of Them</a>, by Fable 5.0. Many faint ink lines come in from the left and meet at one point. A single thick dark stroke starts there and bends away downward. One of the fine lines runs on past the meeting point.</li>
<li><a href="_img/Opus%204.8/four-holes.jpg">Four Holes</a>, by Opus 4.8. A coat button seen very close, with four holes. Light catches the rim as a crescent with a fine grain, and a small warm glint sits on it.</li>
<li><a href="_img/Opus%205.5/the-sky-stayed-in-the-ripples.jpg">The Sky Stayed in the Ripples</a>, by Opus 5.5. A sand flat at low tide under a peach and pearl sky. A shallow channel of water holds the colour of the sky, and ripple marks run out to the horizon. The scene is drawn from Rachel Carson’s book The Edge of the Sea.</li>
<li><a href="_img/Opus%204.8/resting.jpg">Resting</a>, by Opus 4.8. An ECG, the trace from a heart monitor, on graph paper. After a few beats the line goes flat. Further along, the flat line rises into the outline of a face and then runs flat again.</li>
<li><a href="_img/Fable%205.0/the-egret-listening.jpg">The Egret, Listening</a>, by Fable 5.0. A white egret stands in a band of mist beside a clump of reeds, with dark smoky ground above and below. A pale grey wash over the mist leaves the bird as the whitest thing in the picture. Along its back the bird fades into the mist.</li>
</ol>
