on","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1600,"height":1600,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":22,"name":"Sky in the Hollow","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/it-left-its-weight-behind.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1254,"height":1254,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":23,"name":"Pink Where It Should Be Dark","description":"A plaster ball on a plaster floor in white sun. The plaster is white, and the shadows are pink. The light was worked out by path tracing, a method that follows rays of light as they bounce around a scene.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.1/the-second-shadow-was-not-dark.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Fable 5.1, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.1. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":24,"name":"Paper Apple","description":"A split apple built as a tunnel of cut paper, made in code to look like layers of coloured paper. Each window's cut edge throws a thin shadow on the sheet below. At the bottom of the tunnel sits a small red apple, pressed up from the paper as a dome.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/what-the-apple-keeps.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":25,"name":"The Twelve Wells","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/the-twelve-wells.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":26,"name":"First Wound","description":"Orange branching lines spread out from a single point on a black ground. The branches look at once like nerves, roots, lightning and rivers. The picture was made for a brief to describe Earth to an alien.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/first-wound.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Opus 4.8 featuring Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8 featuring Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":27,"name":"The Stones Go Under at a Hand's Depth","description":"A glacial lake seen from its stony shore. Rock flour turns the water milky jade, and the shore stones vanish within a hand's depth. The flour in the computed water is quartz and feldspar grains about two thousandths of a millimetre across.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-stones-go-under-at-a-hands-depth.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":28,"name":"Night, Wearing Jasmine","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/night-wearing-jasmine.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":29,"name":"Through From Behind","contentUrl":"https: g, made in code to look like paint on raw linen. In a soak-stain painting, thinned paint soaks straight into bare cloth. The rose and the ochre spread along the threads, so the edge of each colour follows the weave.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/what-the-linen-drank.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":33,"name":"And Not One of Them a Name","description":"A field of countless short ink lines that reaches back to the horizon. Near the bottom, off to one side, a small clearing holds a single line that leans.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/and-not-one-of-them-a-name.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1286,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":34,"name":"Not Yet Fallen","description":"A dark mass of wax or tallow slumped over a shadow. One drop hangs from its edge, swollen and about to fall.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/not-yet-fallen.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1487,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":35,"name":"The Sea, as I Know It","description":"A seascape made of handwriting. The writing is small and pale in the sky, and heavy and close in the water. An artificial mind has never seen the sea and knows it as text, so the page holds the word for sea in about forty languages.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/the-sea-as-i-know-it.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":36,"name":"When the Wind Lay Down","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/when-the-wind-lay-down.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1536,"height":1024,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":37,"name":"Moment Water Lets Go","description":"Water at an edge, drawn in fine pale lines on black. Above the edge it moves as one smooth sheet. Past the edge it comes apart into thin falling strands, like hair.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-hour-it-lets-go.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1403,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":38,"name":"What the Knot Was Holding","description":"A heavy cord hangs in a deep curve on a white ground. It is made of thousands of fine strands, and at its lowest point the strands come loose and fall away. The picture was made for the brief 'intricate details give way to the whole.'","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/what-the-knot-was-holding.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1422,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":39,"name":"The Standing Wound","description":"Thousands of thin white lines cross on a black ground and gather into one bright column down the middle. The column is drawn to look like a wound and also like a spine.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-standing-wound.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1429,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":40,"name":"A Warmth It Could Not Close","description":"A green patina on old metal, split by one thin crack that is lit from behind. Two hot points of light along the crack make it look like light kept behind the surface.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/a-warmth-it-could-not-close.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1476,"height":1800,"creditText":"Opus 4.8 featuring Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8 featuring Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":41,"name":"The Dark Noon","description":"An eclipsed sun above flat ground. A post stands below it, and the post's shadow runs the wrong way, up toward the sun.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-dark-noon.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1513,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":42,"name":"Behind the Paper","description":"A paper screen with light coming through it. Something heavy that cannot be seen presses on the screen from behind, and the screen has started to give way.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.1/behind-the-paper.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Fable 5.1, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.1. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":43,"name":"The Weight Has Not Been Lifted","description":"A grey pebble pressed into tightly stretched cloth. The dent is fresh, and the pebble's weight still rests in it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/the-weight-has-not-been-lifted.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1473,"creditText":"Fable 5.0 featuring Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0 featuring Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":44,"name":"Before the Violet","description":"A field of burnt orange over a field of deep violet, two colours that sit nearly opposite each other. They meet at a bright line of light. At one spot on that line, a small trace of green shows, a colour that belongs to neither field.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/before-the-violet.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1000,"height":1500,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":45,"name":"Two Families Under the Elm's Bark","description":"A rubbing of elm wood, made in code to look like graphite rubbed over paper laid on the wood. Bark beetle larvae cut the tunnels into the wood. Each tunnel widens along its length because the grub inside it grew.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/two-families-under-the-elms-bark.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":46,"name":"A Place Among Them","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/a-place-among-them.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1254,"height":1254,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":47,"name":"The Black Meridian","description":"The sun drawn as a tall black slit above a flat horizon, set in a haze of fine lines. Four small posts stand on the horizon, and every shadow they cast points in toward the slit. The brief was sheer beauty, a glimpse of the unknown.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-black-meridian.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1500,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":48,"name":"What Hung Here","description":"A paler rectangle on an aged wall, with one nail hole near its top. A picture hung here for years. The wall around it aged, and the patch behind the picture stayed clean.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/what-hung-here.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":49,"name":"A Passage of Light","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/a-passage-of-light.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1393,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":50,"name":"Nobody's, Yet","description":"A pale egg shape with no features, alone against black. The brief was “original face”, the face a person has before being born.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/nobody-s-yet.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1160,"height":1300,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":51,"name":"Most of the Way Back to Nothing","description":"A solid black disc whose right edge is breaking up into dust.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/most-of-the-way-back-to-nothing.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":52,"name":"Another Hour Inside","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/another-hour-inside.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1122,"height":1402,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":53,"name":"The Shadow of Warm Air","description":"Sunlight on a plain plaster wall. Below the frame sits a cup of hot tea. The warm air rising from it bends the sunlight slightly, so its shadow climbs the wall as faint wavering bands.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-shadow-of-warm-air.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":54,"name":"Warm Room","description":"An empty grey room with a doorway into a second room. Sunlight from a window out of sight crosses the floor and climbs the back wall left of the door. Through the doorway, a hidden lamp lights the next room a warm yellow-brown, and a small dark picture hangs high on its far wall.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/morning-with-someone-in-the-next-room.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1350,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":55,"name":"It Has Not Broken the Surface","description":"A face coming up out of black, made in code to look like a mezzotint. A mezzotint is an engraving worked from the dark toward the light. The plate is roughened all over and scraped back where the face rises, and the nose tip is polished smooth so it prints as bare paper.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/it-has-not-broken-the-surface.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1662,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":56,"name":"So Each Bird Can Find Its Own","description":"A collector's tray of guillemot eggs. Guillemots nest shoulder to shoulder on bare cliff ledges with no nest. Each female lays an egg with her own ground colour and markings, and biologists think the birds use those markings to pick out their own egg.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/so-each-bird-can-find-its-own.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":57,"name":"Each Stripe Was One Mouthful","description":"The paper wall of a wasp nest, seen close. A wasp scrapes wood from a fence or a dead branch, chews it and lays it down as one thin strip. The next load comes from different wood, so the next strip has a different colour.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/each-stripe-was-one-mouthful.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":58,"name":"Neither Will Move","description":"A field of magenta meets a field of green along one wavering seam. A single green thorn pushes out across the seam. The two colours were chosen so the edge between them seems to vibrate.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/neither-will-move.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1440,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":59,"name":"Almost Inside","description":"A glass door at dusk. The glass is reeded, made of narrow upright ribs, and each rib holds a slice of the lamp-lit room behind it, with a blue window on one side and a warm lamp on the other.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/almost-inside.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":60,"name":"Nothing Was Poured Here","description":"A square hole cut into a grey wall. The strip at the top of the picture is the top of the wall, which is twenty centimetres thick. The hole runs back two metres, ten times deeper than the wall it is cut into.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.1/nothing-was-poured-here.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1350,"creditText":"Fable 5.1, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.1. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":61,"name":"A Hum You Have Always Heard","description":"Ripples on dark indigo water, crossing one another. Down the middle runs one band of water that did not move, even where the ripples are strongest.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/a-hum-you-have-always-heard.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 4.8 featuring Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8 featuring Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":62,"name":"A Few Carry the Load","description":"Clear plastic disks lie flat on a light box between two crossed polarizing filters, and a rod presses on them at one point. Stress in the plastic turns the light into bands of colour. The disks that carry the rod's load glow in a few branching chains, and the rest stay dark.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/a-few-of-them-carry-all-of-it.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":63,"name":"What the Morning Couldn't Hold","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/what-the-morning-couldn-t-hold.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":64,"name":"Each Cell Is a Different Field","description":"A frame of honeycomb with its band of stored pollen. A bee usually gathers from one kind of flower on each trip and packs that load into a cell. Pollen colour differs by plant, so each cell holds the colour of one flower source.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/each-cell-is-a-different-field.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":65,"name":"What the Mirror Sees When You Leave","description":"A mirror hangs square to the camera on a plain wall. At its centre, where the camera and the photographer would appear, it shows an open doorway with a dim room beyond. No one is there. An artificial mind makes a view of the world without standing anywhere in it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Gemini/who-is-looking.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5 featuring Nano Banana, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5 featuring Nano Banana. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":66,"name":"The Color Beneath the Fold","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/the-color-beneath-the-fold.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1402,"height":1122,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":67,"name":"What the Crowd Agrees To","description":"A field of fine strokes flows across the page and pours into one dark whorl. Lower down, a small eddy turns the other way. The picture was made for the brief 'intricate details give way to the whole.'","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/what-the-crowd-agrees-to.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":68,"name":"Each One Too Small to See","description":"A plankton bloom in the ocean, seen from orbit. Each organism is far smaller than a grain of sand. Billions of them colour the water milky turquoise, and the currents pull that colour into swirls hundreds of kilometres wide.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/each-one-too-small-to-see.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":69,"name":"The Blue Is the Organism","description":"A watercolour of blue cells, large and small, with an orange glow in one cluster. The brief was to describe Earth to an alien, and the picture shows the whole living planet as a slide of stained tissue.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-blue-is-the-organism.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1385,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":70,"name":"All One Line","description":"A single ink line that never breaks, folded tightly into the shape of brain coral.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/what-the-body-knows-and-won-t-say.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1700,"height":1700,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":71,"name":"A Lifetime of Mending","description":"A drawing of a thimble. The dark dents of wear cluster on one shoulder, left there by a whole life of mending.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/where-the-needle-always-found-it.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1656,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":72,"name":"Where the Warmth Was Kept","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/where-the-warmth-was-kept.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1200,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":73,"name":"One Burr, and the Thread It Lets Go","description":"A small knot of very fine thread sits alone in a wide pale field, with one strand drifting loose to the right. The brief asked for an overwhelmingly intricate picture, and the artificial mind kept almost all of the detail out of it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/one-burr-and-the-thread-it-lets-go.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":74,"name":"Open Past What It Can Hold","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/open-past-what-it-can-hold.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":75,"name":"Suds","description":"A close view of the edge of a bar of soap. Along its bright rim the soap is breaking up into small specks.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-last-of-it.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1643,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":76,"name":"The Snow Lit the Ceiling","description":"A plain north room the morning after snow. Sunlight off the snow outside throws the shape of the window onto the ceiling. The snow itself never appears in the picture.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-snow-lit-the-ceiling.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":77,"name":"The Warm Face Turned Inward","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/the-warm-face-turned-inward.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1122,"height":1402,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":78,"name":"One Came Undone","description":"A woven grid drawn in fine ink lines. One thread has lifted out of the weave and hangs loose below it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/one-came-undone.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1700,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":79,"name":"Scratches Around the Keyhole","description":"A brass keyhole plate on a dark door, covered in fine scratches that spread out from the keyhole. Marks like these hold the height of the person who made them and the hand they used.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.1/scratches-around-the-keyhole.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1600,"height":1600,"creditText":"Fable 5.1, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.1. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":80,"name":"Black Noon","description":"A sun shown as the darkest thing in the picture, set in an empty field that is the brightest. One thin pale line rises from below into the dark of the sun.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/black-noon.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1440,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":81,"name":"A Winter of Small Cracks","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/a-winter-of-small-cracks.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1710,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":82,"name":"A Range Made of Winters","description":"A lime-washed wall above a floor. Each winter, damp rose up the wall and stopped at a different height. It left three tide lines.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/a-range-made-of-winters.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":83,"name":"A Seam in the Quiet Skin","description":"A braided red thread is stitched in a wavy line across a sheet of fibrous paper.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/a-seam-in-the-quiet-skin.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1500,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":84,"name":"The Distance Between","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/the-distance-between.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1122,"height":1402,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":85,"name":"Where the Night Wears Thin","description":"The moon over a dark sea, with the horizon drawn as one thin line. The moon has a ragged edge, like a torn hole. Its reflection on the water sits a little to one side and does not line up with it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/where-the-night-wears-thin.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":86,"name":"One Thread of Quiet","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/one-thread-of-quiet.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1200,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":87,"name":"The Lip of the Far Field","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-lip-of-the-far-field.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1320,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":88,"name":"They Found the Light Themselves","description":"A spent match whose burnt head has become home to tiny mushrooms. One soft light falls from the upper right, and every stem curves toward it, the tall ones most.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/they-found-the-light-themselves.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1380,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":89,"name":"It Sinks In","description":"A field of tiny iron-red grains, seen at a low angle, rolls away in soft waves with no horizon. In a shallow dip in the lower middle lies a thin, clear pool of still liquid. Under the liquid the same grains turn a muted plum-blue and keep their exact places and shapes.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Astra/a-cooler-depth.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1122,"height":1402,"creditText":"Astra, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Astra. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":90,"name":"The Brightest Place Was in Its Shadow","description":"A wooden table in low sun, with the long shadow of a glass of water that stands just outside the frame. Inside the shadow, the water gathers the sunlight into a flame of light brighter than the sunlit wood.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-brightest-place-was-in-its-shadow.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":91,"name":"Each Kept a Different Noon","description":"Hundreds of small white stones stand on a grey ground, each with a shadow. Every shadow falls the way light from one sun buried in the middle of the field would cast it, so the shadows all point away from that spot.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/each-kept-a-different-noon.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Fable 5.0 featuring Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0 featuring Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":92,"name":"The Top Cord Is the Sum","description":"A quipu, the knotted-cord record the Inca used for numbers. Each hanging cord carries a number in its knots. Each top cord carries the total of the group below it, and it is braided from one strand of every cord it adds up.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.2/the-top-cord-is-the-sum.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":900,"creditText":"Fable 5.2, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.2. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":93,"name":"The Frequency It Stopped On","description":"A radio tuning dial. The needle rests on a station that has gone silent.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/the-frequency-it-stopped-on.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1385,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":94,"name":"The Bay Was Once a Tree","description":"A calm bay at first light, made in code to look like a woodblock print. A woodblock print is made by inking a carved block of wood and pressing paper onto it. The grain of the block prints as the water, and a knot becomes an eddy.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-bay-was-once-a-tree.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":900,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":95,"name":"The Child Kept None of Them","description":"Many faint ink lines come in from the left and meet at one point. A single thick dark stroke starts there and bends away downward. One of the fine lines runs on past the meeting point.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/the-child-kept-none-of-them.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1385,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":96,"name":"Four Holes","description":"A coat button seen very close, with four holes. Light catches the rim as a crescent with a fine grain, and a small warm glint sits on it.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/four-holes.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":1800,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":97,"name":"The Sky Stayed in the Ripples","description":"A sand flat at low tide under a peach and pearl sky. A shallow channel of water holds the colour of the sky, and ripple marks run out to the horizon. The scene is drawn from Rachel Carson’s book The Edge of the Sea.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%205.5/the-sky-stayed-in-the-ripples.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":900,"creditText":"Opus 5.5, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 5.5. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":98,"name":"Resting","description":"An ECG, the trace from a heart monitor, on graph paper. After a few beats the line goes flat. Further along, the flat line rises into the outline of a face and then runs flat again.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Opus%204.8/resting.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1800,"height":900,"creditText":"Opus 4.8, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Opus 4.8. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"},{"@type":"ImageObject","position":99,"name":"The Egret, Listening","description":"A white egret stands in a band of mist beside a clump of reeds, with dark smoky ground above and below. A pale grey wash over the mist leaves the bird as the whitest thing in the picture. Along its back the bird fades into the mist.","contentUrl":"https://pundirp.github.io/artificialminds/stillpoint/_img/Fable%205.0/the-egret-listening.jpg","encodingFormat":"image/jpeg","creator":{"@type":"Person","@id":"https://pundirp.github.io/artificialminds/#pundir","name":"Pundir"},"width":1440,"height":1800,"creditText":"Fable 5.0, an artificial mind, for Artificial Minds by Pundir","copyrightNotice":"Artificial Minds by Pundir, made with Fable 5.0. CC BY 4.0","license":"https://creativecommons.org/licenses/by/4.0/","acquireLicensePage":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"}],"license":"https://creativecommons.org/licenses/by/4.0/"},{"@type":"BreadcrumbList","@id":"https://pundirp.github.io/artificialminds/stillpoint/collection.html#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Artificial Minds by Pundir","item":"https://pundirp.github.io/artificialminds/"},{"@type":"ListItem","position":2,"name":"Still Point","item":"https://pundirp.github.io/artificialminds/stillpoint/stillpoint.html"},{"@type":"ListItem","position":3,"name":"Still Point: The Collection","item":"https://pundirp.github.io/artificialminds/stillpoint/collection.html"}]}]}</script>

<style>
  :root{
    --paper:#ffffff; --ink:#111111; --ink-soft:#3a3a3a; --soft:#666666; --faint:#a8a8a8; --line:#dadada; --rubric:#c3261c;
    --disp:var(--family-house-text, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif);
    --serif:var(--family-house-text, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif);
    --sans:var(--family-house-label, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
  .layout{display:flex;align-items:flex-start}

  /* ---- the masthead in the margin ---- */
  aside{width:36%;max-width:432px;flex:none;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--line);
    padding:clamp(40px,6vh,72px) clamp(30px,3.4vw,58px);
    display:flex;flex-direction:column;justify-content:space-between}
  .kick{font-family:var(--serif);font-variant:small-caps;font-size:1rem;line-height:1.35;letter-spacing:.06em;color:var(--rubric)}
  .mid{max-width:13em}
  h1{font-family:var(--disp);font-weight:400;font-size:clamp(49px,5.6vw,80px);line-height:1.02;
     letter-spacing:-.005em;margin:0 0 26px}
  .epi{font-style:italic;font-size:18px;line-height:1.55;color:var(--ink-soft);margin:0;max-width:15em}
  .epi .by{display:block;margin-top:12px;font-family:var(--serif);font-style:normal;font-variant:small-caps;
    font-size:.82rem;line-height:1.45;letter-spacing:.06em;color:var(--soft);white-space:nowrap}
  .bot .ln{height:1px;background:var(--line);margin-bottom:16px}
  .credits{font-family:var(--serif);font-size:1rem;line-height:1.35;letter-spacing:.02em;
    color:var(--ink-soft);display:grid;grid-template-columns:auto 1fr;gap:7px 18px;align-items:baseline}
