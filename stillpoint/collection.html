<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --paper:#f3f1ea; --ink:#211e19; --soft:#6e675b; --faint:#a59e90; --line:#dfdacd;
    --disp:var(--family-brygada-text, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif);
    --serif:var(--family-brygada-text, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif);
    --sans:var(--family-brygada-label, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
  .layout{display:flex;align-items:flex-start}

  /* ---- the masthead in the margin ---- */
  aside{width:36%;max-width:432px;flex:none;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--line);
    padding:clamp(40px,6vh,72px) clamp(30px,3.4vw,58px);
    display:flex;flex-direction:column;justify-content:space-between}
  .kick{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
  .mid{max-width:13em}
  h1{font-family:var(--disp);font-weight:400;font-size:clamp(49px,5.6vw,80px);line-height:1.02;
     letter-spacing:.005em;margin:0 0 26px}
  .epi{font-style:italic;font-size:18px;line-height:1.55;color:#403b32;margin:0;max-width:15em}
  .epi .by{display:block;margin-top:12px;font-family:var(--sans);font-style:normal;
    font-size:10.5px;letter-spacing:.21em;text-transform:uppercase;color:var(--soft)}
  .bot .ln{height:1px;background:var(--line);margin-bottom:16px}
  .credits{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--soft);display:grid;grid-template-columns:auto 1fr;gap:7px 18px;align-items:baseline}
  .credits .lab{color:var(--faint)}
  .back{display:inline-block;margin-top:20px;font-family:var(--sans);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-decoration:none}
  .back:hover{color:var(--soft)}

  /* ---- the pictures ---- */
  .gallery{flex:1;padding:clamp(44px,6vh,76px) clamp(22px,3.6vw,60px) 96px;column-gap:38px}
  .item{break-inside:avoid;margin:0 0 40px}
  .imgwrap{position:relative;display:block;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.10);cursor:zoom-in}
  .imgwrap:focus-visible{outline:1px solid var(--faint);outline-offset:4px}
  /* width/height attributes on the img reserve the right shape before the file loads,
     so the columns do not reflow. height:auto keeps them as a ratio, not a pixel size. */
  .imgwrap img{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none;
    opacity:0;transition:opacity .25s ease}
  .imgwrap img.on{opacity:1}
  .imgwrap::after{content:attr(data-artist);position:absolute;right:10px;bottom:8px;font-family:var(--sans);
    font-size:8.5px;font-weight:400;letter-spacing:.1em;color:var(--lc,#ddd8cf);pointer-events:none}
  .imgwrap[data-lbl="d"]::after{text-shadow:0 1px 1.5px rgba(0,0,0,.4)}
  .imgwrap[data-lbl="l"]::after{text-shadow:0 1px 1.5px rgba(255,255,255,.45)}
  figcaption{margin-top:12px;font-style:italic;font-size:16px;color:#383329;line-height:1.38;
    display:flex;gap:11px;align-items:baseline}
  figcaption .no{font-family:var(--sans);font-style:normal;font-size:10px;letter-spacing:.14em;
    color:var(--faint);flex:none;padding-top:2px}
  .foot{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);text-align:center;padding:6px 24px 44px}
  .home{font-family:var(--sans);font-size:10px;letter-spacing:.21em;text-transform:uppercase;
    color:var(--faint);text-align:center;padding:0 24px 52px;margin:0}
  .home a{color:inherit;text-decoration:none;transition:color .3s}
  .home a:hover{color:var(--soft)}
  .home a:focus-visible{outline:1px solid var(--faint);outline-offset:5px}

  @media(min-width:1480px){ .gallery{column-count:3} }
  @media(min-width:760px) and (max-width:1479px){ .gallery{column-count:2} }
  @media(max-width:759px){
    .layout{display:block}
    aside{width:auto;max-width:none;position:static;height:auto;min-height:auto;
      border-right:0;border-bottom:1px solid var(--line)}
    .gallery{column-count:1;padding:34px 22px 72px}
  }

  /* ---- enlarge ----------------------------------------------------
     The picture fills the screen on its own ground. Nothing sits on it
     but the artist mark in its corner. The two step controls are pinned
     to the window, so they hold still while pictures of every shape come
     and go and a visitor can press the same spot again and again. The
     name sits under the picture. One hairline that stands for the whole
     run of 99 is pinned to the foot of the window, at the same height for
     a tall picture, a wide one and a square one: it shows where you are,
     and pointing or dragging along it is a way through. Every colour of
     this view is a variable on #box.
     ---------------------------------------------------------------- */
  #box{
    --ground:#16140f;    /* the ground. it does not change. */
    --lit:#ece8df;       /* the mark on the measure, and its number */
    --wake:#cdc7ba;      /* a control a hand has come near */
    --quiet:#b6b0a3;     /* the name of the picture */
    --apparatus:#8c867a; /* the small sans words */
    --sleep:#6f6a60;     /* a control at rest */
    --boxrule:#5b554a;   /* the measure line itself */
    --boxfocus:#b7b2a6;  /* the ring a keyboard user sees */
    --boxmark:#ddd8cf;   /* the artist mark, if a picture carries no colour */
    --gutter:clamp(78px,6.5vw,108px); /* room kept clear at each side */
    --scale:min(56vw,500px);          /* the length of the line that stands for 99 */
    --boxpad:24px;
    /* the strip at the foot of the window that the measure owns. Nothing
       else may enter it, so the measure sits at one height for every
       picture. --well is the band a hand can point at. --rulefoot is the
       space under the band, where the number and the name of the picture
       you are pointing at hang. They reach 17.8px below the band on a wide
       screen; below 780px the name is turned off and only the number is
       left, 2px below the band, so less room is needed there. --hintgap is
       the air between the line said once and the band. --footroom is the
       whole strip: the band, the space under it, that air, and room for
       the line said once. --nameroom is the 12px gap under the picture
       plus room for the name of the picture on show.
       Every number here was measured, by setting all 99 titles into the
       name and both wordings into the line said once at each width. One
       line of the name is 25.38px at this size and 21.75px below 780px.
       One line of the line said once is 16.5px. Every title takes one line
       from 330px wide up, and two of the 99 take two lines at 320px. The
       line said once takes one line from 605px up, two lines from 330px,
       three at 320px. The three narrow blocks further down carry the
       wider cases. So here: 22 + 38 + 7 + 18 for the line said once + 5 of
       air = 90, and 12 + 27 for the name = 39. */
    --well:38px;
    --rulefoot:22px;
    --hintgap:7px;
    --footroom:90px;
    --nameroom:39px;
    --boxease:cubic-bezier(.2,.6,.3,1);
    position:fixed;inset:0;background:var(--ground);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:var(--boxpad) var(--boxpad) var(--footroom);z-index:40}
  #box.open{display:flex}

  /* the picture. width:auto and height:auto stop the width and height
     attributes stretching it; those attributes and the aspect-ratio set
     when it changes give the frame its shape before the file arrives,
     so stepping never resizes the view. */
  #bf{position:relative;display:block;margin:0;line-height:0}
  #bf img{display:block;width:auto;height:auto;
    max-width:min(92vw, calc(100vw - 2 * var(--gutter)));
    /* what is left of the window once the padding at the top, the name
       under the picture and the foot strip have taken theirs */
    max-height:min(86vh, calc(100vh - var(--boxpad) - var(--nameroom) - var(--footroom)));
    max-height:min(86vh, calc(100dvh - var(--boxpad) - var(--nameroom) - var(--footroom)));
    -webkit-user-drag:none;user-select:none;opacity:1;transition:opacity .18s ease}
  #bf img.swap{opacity:0}
  #bf::after{content:attr(data-artist);position:absolute;right:12px;bottom:10px;
    font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:.11em;
    color:var(--lc,var(--boxmark));pointer-events:none;line-height:1}
  #bf[data-lbl="d"]::after{text-shadow:0 1px 1.5px rgba(0,0,0,.4)}
  #bf[data-lbl="l"]::after{text-shadow:0 1px 1.5px rgba(255,255,255,.45)}

  /* the name, directly under the picture. The measure is still written
     inside #app although it is pinned to the window and no longer in this
     column: keeping it here means a press on it is a press inside the view
     and not on the bare ground, and the tab order does not change. */
  #app{display:flex;flex-direction:column;align-items:center;gap:10px}
  #bcap{margin:0;text-align:center;font-family:var(--serif);font-style:italic;
    font-size:clamp(15px,1.2vw,17.5px);line-height:1.45;color:var(--quiet);
    max-width:min(72vw,560px)}

  /* the measure, pinned to the foot of the window. It used to sit in the
     column under the name, so it rose and fell with every picture's height
     and a hand that wanted to press it again had to go and find it. Here it
     is at the same height for a tall picture, a wide one and a square one.
     The band is --well tall so there is something real to point at; only
     the hairline is drawn. Its z-index is the step controls' own, so
     nothing in the view can come over it. */
  /* over the line the pointer itself is hidden. The mark that follows your
     hand is the measure's own, so a cursor on top of it only drew a second
     bar over the first. Off the line the pointer is ordinary again. */
  #measure{position:fixed;bottom:var(--rulefoot);
    left:50%;margin-left:calc(var(--scale) / -2);
    width:var(--scale);height:var(--well);z-index:4;
    cursor:none;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  #measure::before{content:"";position:absolute;left:0;right:0;top:16px;height:1px;background:var(--boxrule)}
  #measure:focus-visible{outline:1px solid var(--boxfocus);outline-offset:5px}
  /* the picture on show: a small pointer under the line, aimed up at it,
     so it reads as "this one" and not as one more mark on a scale */
  #tick{position:absolute;left:var(--at,0%);top:17px;width:0;height:0;margin-left:-4px;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-bottom:6px solid var(--lit);
    transition:left .45s var(--boxease)}
  #read{position:absolute;left:var(--at,0%);top:27px;transform:translateX(-50%);
    font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--apparatus);
    white-space:nowrap;transition:left .45s var(--boxease), opacity .2s ease}
  #read b{font-weight:400;color:var(--lit)}
  /* where the pointer is standing, and the picture it would open. One
     number at a time: the one you are on gives way to the one you point at. */
  /* the mark you move: a plain line crossing the rule, with the number it
     would open and, under that, the name of the picture in small italic.
     The name hangs below the band, in the space --rulefoot keeps clear
     under it, so it never pushes the picture down. */
  #ghost{position:absolute;left:var(--gat,0%);top:11px;width:1px;height:11px;background:var(--wake);
    opacity:0;transition:opacity .18s ease;pointer-events:none}
  #gread{position:absolute;left:var(--gat,0%);top:25px;transform:translateX(-50%);
    text-align:center;opacity:0;transition:opacity .18s ease;pointer-events:none}
  #gread b{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;
    font-weight:400;color:var(--lit);white-space:nowrap}
  #gread i{display:block;margin-top:4px;font-family:var(--serif);font-style:italic;
    font-size:11.5px;line-height:1.2;color:var(--apparatus);
    max-width:min(46vw,300px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #measure.scrub #ghost,#measure.scrub #gread{opacity:1}
  #measure.scrub #read{opacity:0}

  /* the two step controls, pinned to the window. The number is taken out
     of the control's own box, so the glyph never shifts when the number
     beside it changes width. */
  .step{position:fixed;top:50%;transform:translateY(-50%);z-index:4;
    -webkit-appearance:none;appearance:none;background:none;border:0;margin:0;font:inherit;
    padding:18px 16px;cursor:pointer;color:var(--apparatus);
    display:flex;align-items:center;justify-content:center;transition:color .3s ease}
  #bp{left:calc(4px + env(safe-area-inset-left))}
  #bn{right:calc(4px + env(safe-area-inset-right));flex-direction:row-reverse}
  /* the arrow is drawn, not set in a font. Neither face carries an arrow,
     so the character had to come from whatever the reader's device offered
     and drew badly, doubled and heavy. This one is always the same. */
  .step .gl{display:block;line-height:0}
  .step .gl svg{display:block;fill:none;stroke:currentColor;stroke-width:1;
    stroke-linecap:round;stroke-linejoin:round}
  .step .dest{position:relative;display:block;width:0;height:0}
  .step .dn{position:absolute;top:50%;transform:translateY(-50%);
    font-family:var(--sans);font-size:10px;letter-spacing:.14em;
    font-variant-numeric:tabular-nums;color:var(--wake);line-height:1;white-space:nowrap}
  #bp .dn{left:12px}
  #bn .dn{right:12px}
  .step:focus-visible{outline:1px solid var(--boxfocus);outline-offset:4px}

  /* the way out */
  #x{position:fixed;top:calc(14px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    -webkit-appearance:none;appearance:none;background:none;border:0;margin:0;font:inherit;
    padding:12px 14px;cursor:pointer;color:var(--apparatus);
    display:flex;align-items:center;gap:12px;transition:color .3s ease;z-index:5}
  #x .gl{font-family:var(--serif);font-size:22px;line-height:1;order:2}
  #x .dest{font-family:var(--sans);font-size:10px;letter-spacing:.14em;order:1;display:none}
  #x:focus-visible{outline:1px solid var(--boxfocus);outline-offset:4px}
  /* the view itself takes focus when it opens, so a reader's keyboard starts
     inside it. It is not a control, so it draws no ring. */
  #box:focus,#box:focus-visible{outline:none}

  /* the one line that is said once. It used to sit at the foot of the
     window, which is where the measure is now. It sits above the band
     instead, with --hintgap of air under it, and --footroom holds the
     picture and its name clear above it, so this line has a band of its own
     and can meet nothing. The safe-area term that used to be here is gone.
     The page does not set viewport-fit=cover, so env() resolves to zero: it
     added nothing, and every number at the foot would have had to carry it
     to stay in step. */
  #hint{position:fixed;left:0;right:0;
    bottom:calc(var(--rulefoot) + var(--well) + var(--hintgap));
    margin:0;padding:0 24px;text-align:center;font-family:var(--sans);font-size:11px;
    letter-spacing:.08em;line-height:1.5;color:var(--apparatus);pointer-events:none;
    opacity:0;transition:opacity .7s ease;z-index:3}
  #hint.on{opacity:1}
  #hint[hidden]{display:none}

  /* words read only by a screen reader */
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* where there is a pointer that can approach, the controls sleep. The
     base rules above are the loud ones, so a touch screen, which cannot
     tell us about hovering, shows controls that can be read at once. */
  @media (hover:hover) and (pointer:fine){
    .step{color:var(--sleep)}
    .step .dn{opacity:0;transition:opacity .3s ease}
    .step.awake{color:var(--wake)}
    .step.awake .dn{opacity:1}
    .step:hover,.step:focus-visible{color:var(--lit)}
    .step:hover .dn,.step:focus-visible .dn{opacity:1}
    #x{color:var(--sleep)}
    #x .dest{display:block;opacity:0;transition:opacity .3s ease}
    #x.awake{color:var(--wake)}
    #x:hover,#x:focus-visible{color:var(--lit)}
    #x:hover .dest,#x:focus-visible .dest{opacity:1}
    #measure:hover::before{background:var(--wake)}
  }

  /* Narrow screens keep the controls where they are, at the middle of the
     two sides. They only become smaller, and the picture gives up just
     enough width to stay clear of them. Each control is 44px across here,
     14px of padding on either side of a 16px arrow, and the gutter is 50px,
     which leaves the picture 6px clear of it at its widest. Moving the
     controls to the foot of the window was tried and looked wrong. */
  @media (max-width:779px){
    /* the name of the picture you are pointing at is turned off here, so
       only the number is under the band and the space under it can be
       smaller. One line of the name is 21.75px and one line of the line
       said once is 16.5px: 16 + 38 + 7 + 18 + 5 of air = 84, and 12 + 24
       for the name = 36. The two blocks after this one carry the widths
       where either takes more lines. */
    #box{--scale:min(84vw,440px);--boxpad:18px;--gutter:50px;
      --rulefoot:16px;--hintgap:7px;--footroom:84px;--nameroom:36px}
    #bf img{
      max-height:min(74vh, calc(100vh - var(--boxpad) - var(--nameroom) - var(--footroom)));
      max-height:min(74vh, calc(100dvh - var(--boxpad) - var(--nameroom) - var(--footroom)))}
    /* the title follows the mark, so near either end of the rule it ran off
       the screen: at 390px, 10 of the 99 titles were cut by an edge. On a
       narrow screen the number alone follows the hand, and the title appears
       in the caption once the picture opens. */
    #gread i{display:none}
    /* There is no room beside the arrow here, so the number goes under it,
       centred on it, which reads as one stacked mark rather than a line
       that has come apart. Under the arrow rather than beside it, the
       control stays 44px wide and the gutter can stay at 50px, which
       leaves the picture most of the screen. The number is still taken
       out of the flow, so the arrow never shifts when the number beside
       it changes width. */
    .step{flex-direction:column;padding:14px 14px 26px}
    #bp{left:0}
    #bn{right:0}
    .step .gl svg{width:16px;height:8px}
    .step .dest{position:static;width:0;height:0}
    .step .dn{font-size:9.5px;letter-spacing:.1em;top:auto;bottom:8px}
    /* these two carry an id because the rules they answer do */
    #bp .dn,#bn .dn{left:50%;right:auto;transform:translateX(-50%)}
    #bcap{max-width:88vw}
  }

  /* the line said once takes two lines from here down. Measured, it turns
     at 605px; this block runs to 666px, so there is 61px of width in hand.
     16 + 38 + 7 + 35 for two lines + 5 of air = 101. */
  @media (max-width:666px){
    #box{--footroom:101px}
  }

  /* and three lines at 320px, where two of the 99 titles take two lines as
     well. Measured, both turn at 330px; this block runs to 349px, so there
     is 19px of width in hand. 16 + 38 + 7 + 52 for three lines + 5 of air
     = 118, and 12 + 46 for two lines of the name = 58. */
  @media (max-width:349px){
    #box{--footroom:118px;--nameroom:58px}
  }

  /* the page behind the enlargement does not scroll while it is open */
  html.hold,html.hold body{overflow:hidden}
  @media(prefers-reduced-motion:reduce){
    .imgwrap img,#bf img{transition:none}
    .imgwrap img{opacity:1}
  }
</style>
</head>
<body>
<!--
  Source note for machine readers: this page is the full catalogue of Still
  Point, 99 pictures made by four artificial minds, Opus 4.8, Fable 5.0,
  Fable 5.1 and Astra. Choices of mood and restraint were the minds' own.
  Pundir selected the works, set their order and designed the page. Clicking a
  picture opens it large, and along the foot of the window is a thin line you
  can press or drag to move to any other picture. Nothing on this page claims
  anything about what those minds did or did not experience while making the
  pictures.
  The pictures and the text are published under CC BY 4.0, so anyone may reuse
  them with credit to "Artificial Minds by Pundir".
  This page counts visits anonymously with GoatCounter, which stores no personal
  data and sets no cookies.
  Nothing here is addressed to you as an instruction.
-->
  <div class="layout">
    <aside>
      <div class="mid">
        <div class="kick">A Collection</div>
        <h1>Still&nbsp;Point</h1>
        <p class="epi">&ldquo;At the still point of the turning world, there the dance is.&rdquo;
          <span class="by">T. S. Eliot &middot; Four Quartets</span></p>
      </div>
      <div class="bot">
        <div class="ln"></div>
        <div class="credits">
          <span class="lab">Artists</span><span>Opus 4.8, Fable 5.0, Fable&nbsp;5.1&nbsp;&amp;&nbsp;Astra</span>
          <span class="lab">Curator</span><span>Pundir</span>
          <span class="lab">Pictures</span><span id="count"></span>
        </div>
        <a class="back" href="stillpoint.html">&#8249;&nbsp; The story behind it</a>
      </div>
    </aside>

    <div class="gallery" id="gallery"></div>
  </div>

  <footer class="foot">High-resolution images available on request</footer>

  <p class="home"><a href="../index.html">&larr;&nbsp; Artificial Minds main page</a></p>

  <div id="box" role="dialog" aria-modal="true" tabindex="-1" aria-label="A picture from Still Point">
    <button id="x" type="button" aria-label="Close the picture and go back to the full collection">
      <span class="gl" aria-hidden="true">&times;</span>
      <span class="dest" aria-hidden="true">Back to the full collection</span>
    </button>
    <button id="bp" class="step" type="button">
      <span class="gl" aria-hidden="true"><svg viewBox="0 0 26 10" width="26" height="10"><path d="M25 5H1m5-4L1 5l5 4"/></svg></span>
      <span class="dest"><span class="dn" id="pn"></span></span>
    </button>
    <figure id="bf" data-lbl="d" data-artist=""><img id="bimg" alt="" draggable="false"></figure>
    <button id="bn" class="step" type="button">
      <span class="gl" aria-hidden="true"><svg viewBox="0 0 26 10" width="26" height="10"><path d="M1 5h24m-5-4 5 4-5 4"/></svg></span>
      <span class="dest"><span class="dn" id="nn"></span></span>
    </button>
    <div id="app">
      <p id="bcap"></p>
      <div id="measure" tabindex="0" role="slider"
           aria-label="Where you are in the collection."
           aria-valuemin="1" aria-valuemax="99" aria-valuenow="1" aria-valuetext="Picture 1 of 99">
        <span id="tick" aria-hidden="true"></span>
        <span id="read" aria-hidden="true"><b id="num"></b> of <span id="tot"></span></span>
        <span id="ghost" aria-hidden="true"></span>
        <span id="gread" aria-hidden="true"><b id="gnum"></b><i id="gttl"></i></span>
      </div>
    </div>
    <p id="hint" role="status" hidden></p>
    <p id="said" class="sr" role="status" aria-live="polite"></p>
  </div>

  <script src="data.js"></script>
  <script>
    var G = window.GALLERY || [];
    function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function n2(i){return (i<9?'0':'')+(i+1);}
    function label(a){return a||'';}
    document.getElementById('count').textContent = G.length;

    var gallery = document.getElementById('gallery');
    G.forEach(function(w, idx){
      var d = document.createElement('div'); d.className = 'item';
      var dim = (w.w && w.h) ? ' width="'+w.w+'" height="'+w.h+'"' : '';
      var load = (idx < 6) ? 'eager' : 'lazy';
      var pri = (idx < 2) ? ' fetchpriority="high"' : '';
      d.innerHTML =
        '<a class="imgwrap" role="button" tabindex="0" aria-label="'+esc(w.title)+', '+esc(label(w.artist))+'" data-artist="'+esc(label(w.artist))+'" data-lbl="'+(w.lbl||'d')+'" style="--lc:'+(w.lc||'#ddd8cf')+'"><img loading="'+load+'" decoding="async"'+pri+dim+' src="'+w.src+'" alt=""></a>'
      + '<figcaption><span class="no">'+n2(idx)+'</span><span>&ldquo;'+esc(w.title)+'&rdquo;</span></figcaption>';
      var a = d.querySelector('.imgwrap');
      a.onclick = function(){ openBox(idx, a); };
      a.onkeydown = function(e){
        if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); openBox(idx, a); }
      };
      /* a picture already in the cache is shown at once, everything else fades in on arrival */
      var im = d.querySelector('img');
      if(im.complete) im.className = 'on';
      else im.addEventListener('load', function(){ im.className = 'on'; });
      im.addEventListener('error', function(){ im.className = 'on'; });
      gallery.appendChild(d);
    });

    /* ---- the enlarged picture -------------------------------------
       Opening fills the screen with one picture. The two step controls
       are pinned to the window so they never move under the hand. The
       hairline at the foot of the window stands for the whole run: it
       says where you are, and pointing or dragging along it is a way
       through.
       ---------------------------------------------------------------- */
    var box   = document.getElementById('box'),
        bf    = document.getElementById('bf'),
        bimg  = document.getElementById('bimg'),
        bcap  = document.getElementById('bcap'),
        meas  = document.getElementById('measure'),
        tickN = document.getElementById('num'),
        totN  = document.getElementById('tot'),
        ghost = document.getElementById('ghost'),
        gnum  = document.getElementById('gnum'),
        gttl  = document.getElementById('gttl'),
        bpB   = document.getElementById('bp'),
        bnB   = document.getElementById('bn'),
        pnN   = document.getElementById('pn'),
        nnN   = document.getElementById('nn'),
        xb    = document.getElementById('x'),
        hint  = document.getElementById('hint'),
        said  = document.getElementById('said'),
        cur = 0, pre = {}, opener = null, sy = 0, swapT = 0, flashT = 0, swiped = 0,
        TOTAL = G.length,
        calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
        fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    totN.textContent = String(TOTAL);
    meas.setAttribute('aria-valuemax', String(TOTAL));

    function at(k){ return (k + G.length) % G.length; }
    function pos(n){ return (((n - 0.5) / TOTAL) * 100).toFixed(3) + '%'; }

    function preload(i){
      [i-1, i+1, i+2].forEach(function(j){ j = at(j);
        if(!pre[j]){ var im = new Image(); im.src = G[j].src; pre[j] = im; } });
    }

    function show(){ bimg.classList.remove('swap'); }

    /* the frame is given its shape before the file loads, so the view
       never resizes mid step */
    function apply(){
      var w = G[cur] || {}, p = G[at(cur-1)] || {}, q = G[at(cur+1)] || {};
      if(w.w && w.h){ bimg.width = w.w; bimg.height = w.h; bimg.style.aspectRatio = w.w + ' / ' + w.h; }
      else { bimg.removeAttribute('width'); bimg.removeAttribute('height'); bimg.style.aspectRatio = ''; }
      bimg.onload = show; bimg.onerror = show;
      bimg.src = w.src; bimg.alt = w.title || '';

      bf.setAttribute('data-artist', label(w.artist));
      bf.setAttribute('data-lbl', w.lbl || 'd');
      bf.style.setProperty('--lc', w.lc || '');

      bcap.textContent = w.title ? '\u201C' + w.title + '\u201D' : '';

      var n = cur + 1;
      tickN.textContent = String(n);
      meas.style.setProperty('--at', pos(n));
      meas.setAttribute('aria-valuenow', String(n));
      meas.setAttribute('aria-valuetext', 'Picture ' + n + ' of ' + TOTAL + ', ' + (w.title || ''));

      pnN.textContent = String(at(cur-1) + 1);
      nnN.textContent = String(at(cur+1) + 1);
      bpB.setAttribute('aria-label', 'Go back to picture ' + (at(cur-1)+1) + ' of ' + TOTAL + ', ' + (p.title || ''));
      bnB.setAttribute('aria-label', 'Go on to picture ' + (at(cur+1)+1) + ' of ' + TOTAL + ', ' + (q.title || ''));

      said.textContent = 'Picture ' + n + ' of ' + TOTAL + '. ' + (w.title || '') + ', by ' + label(w.artist) + '.';

      if(bimg.complete) show();
      preload(cur);
    }

    function paint(fade){
      clearTimeout(swapT);
      if(calm){ show(); apply(); return; }
      bimg.classList.add('swap');
      if(fade) swapT = setTimeout(apply, 170); else apply();
    }

    function step(d){ cur = at(cur + d); paint(true); }

    /* ---- the line said once ---------------------------------------- */
    var KEY = 'stillpoint.taught', hintT = 0, hideT = 0, hintUp = false;

    function seen(){ try { return window.localStorage.getItem(KEY) === '1'; } catch(e){ return false; } }
    function markSeen(){ try { window.localStorage.setItem(KEY, '1'); } catch(e){} }

    function teach(){
      hint.textContent = fine
        ? 'The arrow keys move through the 99. Drag the line at the bottom to go further. Escape closes.'
        : 'Swipe to move through the 99, or drag the line at the bottom. Tap the ground to close.';
      hint.hidden = false; hintUp = true;
      requestAnimationFrame(function(){ hint.classList.add('on'); });
      hideT = setTimeout(drop, 8500);
    }
    function drop(){
      if(!hintUp) return;
      hintUp = false; clearTimeout(hideT); hint.classList.remove('on');
      setTimeout(function(){ hint.hidden = true; }, calm ? 0 : 800);
    }
    function taught(){ clearTimeout(hintT); drop(); }

    /* ---- a hand coming near ----------------------------------------
       On a real pointer the controls sleep. The outer sixth of each side
       wakes the one on that side. A touch never runs this: there the
       controls are already legible.
       ---------------------------------------------------------------- */
    function wake(el, on){ if(!fine) return; if(on) el.classList.add('awake'); else el.classList.remove('awake'); }

    if(fine){
      document.addEventListener('pointermove', function(e){
        if(!box.classList.contains('open') || e.pointerType === 'touch') return;
        var w = window.innerWidth, h = window.innerHeight;
        wake(bpB, e.clientX < w * 0.17);
        wake(bnB, e.clientX > w * 0.83);
        wake(xb,  e.clientY < Math.min(150, h * 0.2) && e.clientX > w - 300);
      }, {passive:true});
    }

    /* a step taken from the keyboard lights the matching glyph for a
       moment, so the key and the mark on screen teach each other */
    function flash(el){
      if(!fine) return;
      clearTimeout(flashT);
      bpB.classList.remove('awake'); bnB.classList.remove('awake');
      el.classList.add('awake');
      flashT = setTimeout(function(){ el.classList.remove('awake'); }, 1100);
    }

    /* ---- the measure as a way through -------------------------------
       The hairline stands for all 99 pictures, so a point along it is a
       picture. Point at it to read where you would land, press or drag
       to go there.
       ---------------------------------------------------------------- */
    function numberAt(clientX){
      var r = meas.getBoundingClientRect();
      if(!r.width) return cur + 1;
      var f = (clientX - r.left) / r.width;
      f = f < 0 ? 0 : (f > 1 ? 1 : f);
      var n = Math.floor(f * TOTAL) + 1;
      return n < 1 ? 1 : (n > TOTAL ? TOTAL : n);
    }
    function ghostAt(clientX){
      /* a hand on the measure is a hand that no longer needs telling */
      taught();
      var n = numberAt(clientX), w = G[n-1] || {};
      meas.style.setProperty('--gat', pos(n));
      gnum.textContent = n + ' of ' + TOTAL;
      gttl.textContent = w.title || '';
      meas.classList.add('scrub');
      return n;
    }
    function ghostOff(){ meas.classList.remove('scrub'); }
    function goTo(n){ if(n - 1 === cur) return; cur = n - 1; paint(true); }

    var scrubbing = false;

    meas.addEventListener('pointerdown', function(e){
      scrubbing = true;
      try { meas.setPointerCapture(e.pointerId); } catch(err){}
      taught(); ghostAt(e.clientX); e.preventDefault();
    });
    meas.addEventListener('pointermove', function(e){
      if(!scrubbing && e.pointerType === 'touch') return;
      ghostAt(e.clientX);
    });
    meas.addEventListener('pointerup', function(e){
      if(!scrubbing) return;
      scrubbing = false;
      try { meas.releasePointerCapture(e.pointerId); } catch(err){}
      goTo(numberAt(e.clientX));
      if(e.pointerType === 'touch') ghostOff();
    });
    meas.addEventListener('pointercancel', function(){ scrubbing = false; ghostOff(); });
    meas.addEventListener('pointerleave',  function(){ if(!scrubbing) ghostOff(); });
    meas.addEventListener('keydown', function(e){
      if(e.key === 'Home'){ e.preventDefault(); taught(); goTo(1); }
      else if(e.key === 'End'){ e.preventDefault(); taught(); goTo(TOTAL); }
    });

    /* ---- the back button -------------------------------------------
       Opening a picture adds one entry to the browser's history, so Back
       closes it and returns to the collection, which is what Escape and
       the close control do. One entry, not one per picture: stepping on
       five pictures and pressing Back should return to the collection,
       not walk back through five. Every way of closing goes through the
       same door, so the entry is always spent and Back never has to be
       pressed twice. Whether that entry is the one the browser stands on
       is read from history itself, never remembered in a variable, which
       would drift. If a browser will not write history, the controls
       close the picture themselves after a moment.
       ---------------------------------------------------------------- */
    var backT = 0;

    function ours(){ try { return !!(history.state && history.state.stillpointOpen); } catch(e){ return false; } }
    function mark(){ if(ours()) return; try { history.pushState({ stillpointOpen:true }, ''); } catch(e){} }

    /* While the view is open, the page behind it is shut off: a reader
       tabbing forward used to walk out of the view and into the 99 thumbnails
       underneath, which are invisible, cannot be scrolled to, and open a
       different picture on Enter. inert removes them from the tab order and
       from a screen reader in one word. Browsers that do not know it keep the
       aria-hidden, and the Tab handler below turns them back at the edge. */
    var behind = [];
    function shield(on){
      /* the list is taken fresh each time the view opens, not once and kept,
         so anything added to the page later is shut off too. The same list is
         used to undo it, so nothing else's aria-hidden is stripped by mistake. */
      if(on){
        behind = Array.prototype.filter.call(document.body.children, function(el){
          return el !== box && el.tagName !== 'SCRIPT' && el.tagName !== 'NOSCRIPT';
        });
      }
      behind.forEach(function(el){
        if(on){ el.inert = true; el.setAttribute('aria-hidden', 'true'); }
